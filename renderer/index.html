<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src file: data: 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>vibes machine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">folders</span>
        <button class="icon-btn" id="sidebar-collapse" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">&#8249;</button>
      </div>
      <nav class="folder-tabs" id="folder-tabs" aria-label="Linked folders"></nav>
      <button class="add-folder" id="add-folder" type="button">+ add folder</button>
    </aside>

    <div class="main" id="main">
      <header>
        <button class="icon-btn sidebar-open" id="sidebar-open" type="button" aria-label="Show folders" title="Show folders">&#9776;</button>
        <h1>vibes machine</h1>
        <span class="count" id="count">0 images</span>
        <div class="paste-zone" id="paste-zone" tabindex="0" contenteditable="true" spellcheck="false" aria-label="Paste image from clipboard">
          paste image here <kbd>⌘V</kbd>
        </div>
        <button class="icon-btn film" id="film" type="button" aria-label="Open collection" title="Collection">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <path d="M7 4v16M17 4v16" />
            <path d="M2 8h5M2 12h5M2 16h5M17 8h5M17 12h5M17 16h5" />
          </svg>
          <span class="badge" id="film-count" aria-hidden="true"></span>
        </button>
      </header>

      <div class="empty" id="empty">
        no screenshots yet.<br />
        paste <kbd>⌘V</kbd> or drag images in.
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="modal" id="modal" aria-hidden="true">
      <button class="close" aria-label="Close">&times;</button>
      <button class="nav prev" aria-label="Previous">&#8249;</button>
      <img id="modal-img" alt="" />
      <button class="nav next" aria-label="Next">&#8250;</button>
      <div class="caption" id="modal-caption"></div>
    </div>

    <div class="sheet-backdrop" id="collection" aria-hidden="true">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Collection">
        <div class="sheet-head">
          <h2>collection</h2>
          <span class="n" id="collection-count">0</span>
          <button class="close" id="collection-close" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="sheet-body" id="collection-grid"></div>
        <div class="sheet-foot">
          <button class="ghost" id="collection-clear" type="button">clear</button>
          <select class="dest" id="collection-dest" aria-label="Destination folder"></select>
          <button class="ghost" id="collection-copy" type="button">copy to</button>
          <span class="sep" aria-hidden="true"></span>
          <button class="primary" id="collection-create" type="button">create folder</button>
        </div>
      </div>
    </div>

    <div class="busy-overlay" id="busy-overlay" aria-hidden="true"></div>

    <div class="statusbar" id="statusbar" role="status" aria-live="polite"></div>

    <script src="main.js"></script>
  </body>
</html>
